name: Actualizar Cartelera Automática

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias (axios)
        run: npm install axios

      - name: Ejecutar bot de sincronización
        run: node sincronizar.js

      - name: Forzar limpieza total de nombres duplicados
        run: |
          rm -f "películas.json"
          git rm -f "películas.json" || true

      - name: Autocommit del nuevo archivo JSON
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Actualización automática limpia"
          file_pattern: peliculas.json
          skip_ci: true
