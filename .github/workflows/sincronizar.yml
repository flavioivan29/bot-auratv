name: Actualizar Cartelera Automática

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (axios)
        run: npm install axios

      - name: Ejecutar bot de sincronización
        run: node sincronizar.js

      - name: Limpiar archivos antiguos o con tilde si quedaran
        run: |
          rm -f "películas.json"
          git rm -f "películas.json" || true

      - name: Autocommit del nuevo archivo JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Actualización automática de cartelera"
          file_pattern: cartelera.json
          skip_ci: true
